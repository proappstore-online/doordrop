name = "pas-data-doordrop"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
APP_ID = "doordrop"

# SESSION_SIGNING_KEY is a SECRET, not a var — set it with
#   wrangler secret put SESSION_SIGNING_KEY
# It replaces the old FAS_API_BASE round-trip: sessions are now verified
# locally instead of by asking FreeAppStore about a ProAppStore token (#71).

[[d1_databases]]
binding = "DB"
database_name = "pas-data-doordrop"
database_id = "7e14b85d-899a-4274-8b0e-ee224f4814de"
